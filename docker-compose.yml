services:
  # 1. Nginx Ingress & Reverse Proxy
  web:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: slicemart-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_storage:/var/www/backend/storage:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - slicemart-network

  # 2. PHP 8.5-FPM Backend API Core
  app:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: slicemart-app
    restart: unless-stopped
    env_file:
      - backend/.env
    volumes:
      - backend_storage:/var/www/backend/storage
    healthcheck:
      test: ["CMD-SHELL", "php -r \"echo file_get_contents('http://localhost:9000/up') ?: exit(0);\" || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - slicemart-network

  # 3. Relational Database (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: slicemart-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-slicemart_production}
      POSTGRES_USER: ${DB_USERNAME:-slicemart_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecureProductionPassword123!}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-slicemart_app} -d ${DB_DATABASE:-slicemart_production}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - slicemart-network

  # 4. Asynchronous Queue Worker Daemon
  queue-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: slicemart-queue-worker
    restart: unless-stopped
    command: php /var/www/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --queue=default,exports,couriers,notifications
    env_file:
      - backend/.env
    volumes:
      - backend_storage:/var/www/backend/storage
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - slicemart-network

  # 5. Scheduled Maintenance & Periodic Purge Daemon
  scheduler:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: slicemart-scheduler
    restart: unless-stopped
    command: php /var/www/backend/artisan schedule:work
    env_file:
      - backend/.env
    volumes:
      - backend_storage:/var/www/backend/storage
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - slicemart-network

volumes:
  backend_storage:
    driver: local
  db_data:
    driver: local

networks:
  slicemart-network:
    driver: bridge
