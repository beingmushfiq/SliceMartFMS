# Production Nginx Ingress Configuration for SliceMart FMS
# Target: High-throughput ERP API + React 19 SPA Static Delivery

server {
    listen 80;
    server_name _;
    root /var/www/frontend/dist;
    index index.html;

    client_max_body_size 100M;
    server_tokens off;

    # Gzip Compression for High Network Efficiency
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Global Security Headers (ARCHITECTURE §5.7)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 1. Hashed Static Assets — Immutable 1-Year Cache
    # Generated by Vite with content hashes: chunk-[hash].js, style-[hash].css
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # 2. Static Favicons, Web Manifest, and Robot Instructions
    location ~* \.(ico|webmanifest|txt|xml)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    # 3. Backend Health Probe Direct Pass-Through
    location = /up {
        root /var/www/backend/public;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
        access_log off;
    }

    # 4. Backend API Ingress Routing (/api/*)
    location ^~ /api/ {
        root /var/www/backend/public;
        try_files $uri /index.php$is_args$args;

        # FastCGI buffer tuning for large multi-row ERP queries
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
        fastcgi_connect_timeout 10s;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # 5. Frontend Single Page Application (SPA) HTML Routing
    # Strictly non-cached to ensure zero stale chunks upon deployment
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
